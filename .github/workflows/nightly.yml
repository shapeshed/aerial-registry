name: Build and publish registry

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download station state
        run: aws s3 cp s3://${{ vars.S3_BUCKET }}/state/state.db state.db || echo "No previous state; starting fresh"

      - name: Run pipeline
        env:
          RADIO_FRANCE_API_KEY: ${{ secrets.RADIO_FRANCE_API_KEY }}
        run: cargo run --release

      - name: Upload station state
        run: aws s3 cp state.db s3://${{ vars.S3_BUCKET }}/state/state.db

      - name: Upload to S3
        run: |
          aws s3 cp registry.json.gz s3://${{ vars.S3_BUCKET }}/registry.json.gz \
            --content-type application/json \
            --content-encoding gzip \
            --cache-control "public, max-age=86400"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths '/registry.json.gz'

      - name: Prune curated stations
        run: cargo run --release -- prune-curated

      - name: Open curated station cleanup PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/prune-curated-stations
          delete-branch: true
          title: "chore(curated): prune failed stations"
          commit-message: "chore(curated): prune failed stations"
          body: |
            Automated cleanup from the nightly registry build.

            This removes curated stations that failed the registry liveness policy
            and appends them to `stations_rejected.toml` so discovery does not
            propose them again.

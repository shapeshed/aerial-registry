name: Build registry

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Read-only: gives the guard (src/pipeline/guard.rs) a local copy of
      # the last human-approved registry to compare against, so a provider
      # outage this run carries forward its previous entries instead of
      # silently publishing a hole. Nothing is fetched from this over the
      # network at pipeline runtime — it's a plain file on disk.
      - uses: actions/checkout@v4
        with:
          repository: shapeshed/aerial
          path: aerial-app
          sparse-checkout: app/src/main/registry/registry.json
          sparse-checkout-cone-mode: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download station state
        run: aws s3 cp s3://${{ vars.S3_BUCKET }}/state/state.db state.db || echo "No previous state; starting fresh"

      - name: Run pipeline
        env:
          RADIO_FRANCE_API_KEY: ${{ secrets.RADIO_FRANCE_API_KEY }}
          AERIAL_PREVIOUS_REGISTRY_PATH: aerial-app/app/src/main/registry/registry.json
        run: cargo run --release

      - name: Upload station state
        run: aws s3 cp state.db s3://${{ vars.S3_BUCKET }}/state/state.db

      - name: Report anomalies
        if: ${{ hashFiles('anomalies.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Nightly registry anomalies"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file anomalies.md
          else
            gh issue create --title "$title" --body-file anomalies.md
          fi

      # Not published anywhere — the app bundles a snapshot instead of
      # fetching one. This is only a downloadable candidate for you to pull
      # down, decompress, test on a device, and copy into the app repo
      # yourself before a release.
      - name: Upload registry artifact
        uses: actions/upload-artifact@v4
        with:
          name: registry
          path: registry.json.gz
          retention-days: 14

      - name: Prune curated stations
        run: cargo run --release -- prune-curated

      - name: Open curated station cleanup PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/prune-curated-stations
          delete-branch: true
          title: "chore(curated): prune failed stations"
          commit-message: "chore(curated): prune failed stations"
          body: |
            Automated cleanup from the nightly registry build.

            This removes curated stations that failed the registry liveness policy
            and appends them to `stations_rejected.toml` so discovery does not
            propose them again.

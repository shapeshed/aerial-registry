name: Update AI enrichment overlay

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max stations to assess this run'
        required: false
        default: '200'

permissions:
  contents: write
  pull-requests: write

jobs:
  enrich:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build overlay delta
        env:
          RADIO_FRANCE_API_KEY: ${{ secrets.RADIO_FRANCE_API_KEY }}
          AERIAL_AI_URL: https://api.anthropic.com/v1
          AERIAL_AI_MODEL: claude-haiku-4-5-20251001
          AERIAL_AI_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AERIAL_AI_CONCURRENCY: '4'
          AERIAL_AI_LIMIT: ${{ inputs.limit || '200' }}
        run: cargo run --release -- enrich-overlay

      - name: Open enrichment PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/ai-enrichment
          delete-branch: true
          add-paths: enrichment.toml
          title: "chore(enrichment): weekly AI overlay update"
          commit-message: "chore(enrichment): weekly AI overlay update"
          body: |
            Automated update of `enrichment.toml` from the weekly AI
            enrichment job. Only stations that are new or whose
            provider-supplied fields changed since the last run were
            re-assessed.

            Review the diff, adjust entries by hand where the model got it
            wrong, and merge. The nightly build applies this file
            deterministically.
